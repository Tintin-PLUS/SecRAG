[package]
name = "knowledge_base"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pdf-extract = "0.7"
walkdir = "2.5"
chrono = "0.4"
uuid = { version = "1.0", features = ["v4"] }
tiny_http = "0.12"
jieba-rs = "0.7"
ureq = { version = "2.10", features = ["json"] }
